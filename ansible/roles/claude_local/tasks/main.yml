---
# Install the claude-local launcher and register its zsh alias

- name: Ensure claude-local script is executable
  ansible.builtin.file:
    path: "{{ claude_local_script }}"
    mode: "0755"
    state: file

- name: Register claude-local alias in .zshrc
  ansible.builtin.blockinfile:
    path: "{{ home_dir }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - claude-local"
    create: true
    mode: "0644"
    block: |
      # claude-local launcher (from claude_configurations repo)
      alias {{ claude_local_alias }}="{{ claude_local_script }}"
