---
# Claude Code Agent Monitor — real-time dashboard for Claude Code sessions.
# No published image exists, so docker compose builds from the cloned repo.
# Runs in production mode (port 4820), restart: unless-stopped.

- name: Clone/update Claude Code Agent Monitor repo
  ansible.builtin.git:
    repo: "{{ agent_monitor_repo }}"
    dest: "{{ agent_monitor_dir }}"
    version: "{{ agent_monitor_branch }}"
    update: true
  register: am_clone

- name: Check if agent-monitor container is already running
  ansible.builtin.command: docker ps --filter name=agent-monitor --format '{{ "{{" }}.Names{{ "}}" }}'
  register: am_ps
  changed_when: false
  failed_when: false

- name: Build and start Agent Monitor (docker compose up -d --build)
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ agent_monitor_dir }}"
  register: am_up
  # Rebuild when the repo changed or the container isn't up yet.
  when: am_clone.changed or 'agent-monitor' not in (am_ps.stdout | default(''))
  changed_when: am_up.rc == 0
  environment:
    DASHBOARD_PORT: "{{ agent_monitor_port }}"

- name: Wait for Agent Monitor dashboard to respond
  ansible.builtin.uri:
    url: "{{ agent_monitor_url }}"
    status_code: [200, 301, 302]
  register: am_health
  retries: 10
  delay: 3
  until: am_health.status is defined and am_health.status in [200, 301, 302]
  failed_when: false

# Install the Agent Monitor hooks into ~/.claude/settings.json so EVERY Claude
# Code instance forwards events to the dashboard. The installer MERGES into the
# existing hooks (push, dedup by hook-handler.js) — it does NOT overwrite the
# codebase-memory / rtk hooks already present. Idempotent.
- name: Resolve a usable node binary for the hook installer
  ansible.builtin.shell:
    cmd: >-
      command -v node
      || ls {{ home_dir }}/.nvm/versions/node/*/bin/node 2>/dev/null | tail -1
  register: am_node
  changed_when: false
  failed_when: am_node.stdout | trim | length == 0

- name: Check if Agent Monitor hooks are already in settings.json
  ansible.builtin.command:
    cmd: grep -q hook-handler.js {{ home_dir }}/.claude/settings.json
  register: am_hooks_present
  changed_when: false
  failed_when: false

- name: Install Agent Monitor hooks into ~/.claude/settings.json (merges)
  ansible.builtin.command:
    cmd: "{{ am_node.stdout | trim }} scripts/install-hooks.js"
    chdir: "{{ agent_monitor_dir }}"
  register: am_hooks
  changed_when: am_hooks.rc == 0
  failed_when: am_hooks.rc != 0
  when: am_hooks_present.rc != 0

- name: Show Agent Monitor status
  ansible.builtin.debug:
    msg:
      - "Agent Monitor dashboard: {{ agent_monitor_url }}"
      - "health: {{ 'UP (' ~ am_health.status ~ ')' if (am_health.status is defined) else 'not reachable yet — check `docker logs agent-monitor`' }}"
      - "hooks: installed (all Claude instances report to the dashboard; restart open sessions)"
