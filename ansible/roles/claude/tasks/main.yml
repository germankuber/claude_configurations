---
# Install Claude Code via the official Anthropic installer.
# NOTE: pnpm global is intentionally NOT used — Claude Code's installer
# rejects pnpm's --ignore-scripts and leaves a broken `claude.exe` shim.
# The official installer manages its own versions under ~/.local.

- name: Check if claude is already installed
  ansible.builtin.command: claude --version
  register: claude_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ home_dir }}/.local/bin:{{ ansible_env.PATH }}"

- name: Install Claude Code via official installer
  ansible.builtin.shell:
    cmd: "curl -fsSL https://claude.ai/install.sh | bash"
  register: claude_install
  changed_when: claude_install.rc == 0
  when: claude_check.rc != 0

- name: Report Claude Code version
  ansible.builtin.command: claude --version
  register: claude_final
  changed_when: false
  environment:
    PATH: "{{ home_dir }}/.local/bin:{{ ansible_env.PATH }}"

- name: Show Claude Code version
  ansible.builtin.debug:
    msg: "Claude Code: {{ claude_final.stdout }}"
