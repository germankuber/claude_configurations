---
# ============================================================================
# Global variables for Claude Code environment provisioning (macOS)
# ============================================================================

# --- Paths -----------------------------------------------------------------
home_dir: "{{ ansible_env.HOME }}"
# pnpm global bin directory (where `pnpm add -g` installs binaries)
pnpm_home: "{{ ansible_env.PNPM_HOME | default(home_dir + '/Library/pnpm') }}"
local_bin: "/usr/local/bin"

# --- Socket Firewall (sfw) -------------------------------------------------
sfw_bin_path: "{{ local_bin }}/sfw"
# Official install script from socket.dev
sfw_install_url: "https://socketsecurity.dev/install.sh"
# Shell aliases that wrap package managers with sfw.
# NOTE: npm is intentionally excluded — it is disabled via an `npm()` function
# in .zshrc (forces pnpm). Aliasing npm would conflict with that function and
# break .zshrc parsing ("defining function based on alias `npm'").
sfw_aliases:
  - { name: pnpm, value: "sfw pnpm" }
  - { name: yarn, value: "sfw yarn" }

# --- Claude Code -----------------------------------------------------------
claude_package: "@anthropic-ai/claude-code"

# --- MCP server scope for `claude mcp add` ---------------------------------
mcp_scope: "user"

# --- codebase-memory-mcp (UI variant) --------------------------------------
# Official installer; the UI variant ships the 3D graph at localhost:9749.
cbm_install_url: "https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh"
cbm_bin: "{{ home_dir }}/.local/bin/codebase-memory-mcp"
cbm_ui_port: 9749
# Auto-index repos on connect/change (vs manual index_repository calls)
cbm_auto_index: true
cbm_auto_index_limit: 200000

# Filesystem MCP: directories the server is allowed to access
filesystem_mcp_roots:
  - "{{ home_dir }}/Documents/Repositories"

# Context7 API key — read from CONTEXT7_API_KEY env var.
# Empty -> Context7 registered without a key (limited functionality).
context7_api_key: "{{ lookup('env', 'CONTEXT7_API_KEY') | default('', true) }}"

# GitHub MCP — installed as the official Claude plugin (HTTP remote).
# Matches the current setup: plugin `github@claude-plugins-official`.
github_plugin: "github@claude-plugins-official"

# --- Claude Code Agent Monitor (dashboard via Docker) ----------------------
agent_monitor_repo: "https://github.com/hoangsonww/Claude-Code-Agent-Monitor.git"
agent_monitor_branch: "master"
agent_monitor_dir: "{{ home_dir }}/.local/share/claude-code-agent-monitor"
agent_monitor_port: 4820
agent_monitor_url: "http://localhost:4820"

# --- claude-local launcher -------------------------------------------------
# Path to the claude-local script in this repo (relative to repo root).
claude_local_script: "{{ home_dir }}/Documents/Repositories/claude_configurations/scripts/claude-local"
claude_local_alias: "claude-local"

# --- Python toolchain ------------------------------------------------------
brew_python_formula: "python@3.12"
# uv (astral) — required by spec-kit
brew_uv_formula: "uv"
# pipx — isolated CLI installs (headroom)
brew_pipx_formula: "pipx"

# --- Headroom (context compression) ----------------------------------------
headroom_pipx_spec: "headroom-ai[all]"
# Headroom has a native PyO3 (Rust) extension that only supports Python <= 3.13.
# Pin pipx to the brew-installed python@3.12 so the build does not pick 3.14.
headroom_python: "/opt/homebrew/opt/{{ brew_python_formula }}/bin/python3.12"

# --- spec-kit (specify CLI) ------------------------------------------------
# Pin to a release tag; `latest` resolves the newest GitHub release.
spec_kit_version: "latest"
spec_kit_git: "git+https://github.com/github/spec-kit.git"
